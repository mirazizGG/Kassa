name: Verify application

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, mbstring, curl
      # Sintaksis tekshiruvi: har bir PHP fayl.
      - run: find app bin public -name "*.php" -print0 | xargs -0 -n1 php -l
      # Sxema bo'sh SQLite bazada xatosiz yaratiladimi.
      - run: |
          printf "APP_ENV=development\nSECRET_KEY=%s\nDATABASE_URL=sqlite:./ci.db\n" "$(php -r 'echo bin2hex(random_bytes(32));')" > .env
          php bin/setup.php
