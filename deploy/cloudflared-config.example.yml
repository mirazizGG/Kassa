# Cloudflare Tunnel sozlamasi.
# Buni  C:\Users\<foydalanuvchi>\.cloudflared\config.yml  ga nusxalang
# va <...> joylarni to'ldiring.
#
# TUNNEL_ID va credentials fayli `cloudflared tunnel create kassa` buyrug'idan keyin paydo bo'ladi.

tunnel: <TUNNEL_ID>
credentials-file: C:\Users\<FOYDALANUVCHI>\.cloudflared\<TUNNEL_ID>.json

# Ulanish barqarorligi
originRequest:
  connectTimeout: 30s
  noTLSVerify: false

ingress:
  # Butun tizim bitta manzildan (backend'ning o'zi frontend + API + /uploads beradi).
  # To'g'ridan-to'g'ri :8000 ga - Caddy KERAK EMAS.
  # (Caddy ishlatilsa: http://localhost:8080)
  - hostname: kassa.<SIZNING-DOMEN>
    service: http://localhost:8000

  # Majburiy oxirgi qoida
  - service: http_status:404
