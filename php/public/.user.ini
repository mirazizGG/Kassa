; PHP sozlamalari — cPanel/CloudLinux buni O'ZI o'qiydi (.user.ini).
;
; Bu faylning ma'nosi bitta: PHP ni har so'rovda ORTIQCHA ISH qilmasga
; majburlash. Eng kattasi — opcache: usiz PHP har so'rovda barcha fayllarni
; qaytadan o'qib, tahlil qilib, baytkodga o'giradi. Opcache bilan bu bir
; marta bo'ladi va keyin xotiradan olinadi.
;
; Eslatma: hostingda ba'zi qiymatlarni o'zgartirish taqiqlangan bo'lishi
; mumkin — u holda ular jimgina e'tiborsiz qoldiriladi va ilova baribir
; ishlayveradi. Tekshirish uchun: cPanel -> Select PHP Version -> Options.

; --- Opcache: eng katta tejamkorlik ------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
; Ilova kichik — 32 MB yetib ortadi.
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
; Fayllar soni 100 dan kam, lekin zaxira bilan.
opcache.max_accelerated_files = 1000
; Faylni o'zgarganini tekshirish oralig'i (sekund). 0 emas: yangilanishdan
; keyin qayta ishga tushirishni unutish oson, 60 soniya esa sezilmaydi.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
; Izohlarni saqlamaslik xotirani tejaydi. Bu loyihada izohlarga tayanadigan
; kutubxona yo'q (annotatsiya, Doctrine va h.k. ishlatilmaydi).
opcache.save_comments = 0
opcache.fast_shutdown = 1

; --- Fayl yo'llari keshi ------------------------------------------------
; Har require da PHP yo'lni tekshiradi (stat). Kesh bu chaqiruvlarni kamaytiradi.
realpath_cache_size = 512K
realpath_cache_ttl = 300

; --- Siqish -------------------------------------------------------------
; mod_deflate bo'lmasa ham JSON siqilib ketadi. Savdolar tarixi 700 KB dan
; ~60 KB gacha kichrayadi.
zlib.output_compression = On
zlib.output_compression_level = 5

; --- Chegaralar ---------------------------------------------------------
; Kassa so'rovi sekundlab ishlamaydi; uzoq so'rov — bu xato belgisi.
max_execution_time = 60
memory_limit = 128M

; Nakladnoy fotosi uchun 10 MB chegarasi ilovada ham bor.
upload_max_filesize = 12M
post_max_size = 14M
max_file_uploads = 5

; --- Xavfsizlik ---------------------------------------------------------
; Xato matnida baza paroli va fayl yo'llari bo'ladi — ekranga chiqmasin.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Server versiyasini sarlavhada e'lon qilmaymiz.
expose_php = Off
